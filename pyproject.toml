[project]
name = "fraud-mcp"
version = "0.1.0"
description = "An MCP server exposing deterministic fraud-investigation tools to AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
]

[project.scripts]
fraud-mcp = "fraud_mcp.__main__:main"

[project.optional-dependencies]
http = ["uvicorn>=0.30", "starlette>=0.37"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:fraud_mcp.*"]
